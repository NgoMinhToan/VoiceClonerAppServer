services:
  db:
    image: postgres:16-alpine
    container_name: voicecloner-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-voice_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-voice_pass}
      POSTGRES_DB: ${POSTGRES_DB:-voicecloner}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-voice_user} -d ${POSTGRES_DB:-voicecloner}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: voicecloner-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  appserver:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/${DOCKER_USER:-ngominhtoan}/voicecloner_appserver:${TAG:-latest}
    container_name: voicecloner-appserver
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-voice_user}:${POSTGRES_PASSWORD:-voice_pass}@db:5432/${POSTGRES_DB:-voicecloner}
      REDIS_URL: redis://redis:6379/0
      CONFIG_PATH: /app/VoiceClonerAppServer/config/settings.json
    ports:
      - "8000:8000"
    volumes:
      - ./config:/app/VoiceClonerAppServer/config
      - ./storage:/app/VoiceClonerAppServer/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
